name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install GTK smoke-test and shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb xauth shellcheck
      - name: Run regression and GTK smoke tests
        env:
          RHYTHM_FORGE_REQUIRE_GTK_TESTS: '1'
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
      - name: Check Python and shell files
        run: |
          python3 -m py_compile app/*.py
          bash -n app/check-dependencies app/rhythm-forge install.sh uninstall.sh run.sh build.sh
          shellcheck app/check-dependencies app/rhythm-forge install.sh uninstall.sh run.sh build.sh
